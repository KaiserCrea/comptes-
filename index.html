<style>
:root{
  --noir:#251206; --carte:#331A09; --carte2:#3A1D0C; --trait:#4A2A13;
  --or:#B8934E; --or-fonce:#8A6A34; --or-sombre:#6B4C24;
  --creme:#F2E6D0; --creme2:#EEDFC4; --sable:#E8D6B8; --brun:#96784F;
  --vert:#C0DD97; --rouge:#F0997B; --alerte:#E24B4A;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--noir);color:var(--creme2);font-family:var(--sans);font-size:15px;overscroll-behavior:none}
.num{font-family:var(--serif);font-weight:400}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
input{background:var(--noir);border:.5px solid var(--or-sombre);border-radius:8px;padding:11px 12px;width:100%;outline:none}
input:focus{border-color:var(--or)}
input[type=date]{-webkit-appearance:none}

#app{display:flex;flex-direction:column;height:100%}
header{padding:20px 16px 0;flex:none}
.moisnav{display:flex;align-items:center;justify-content:center;gap:2px}
.titre{font-family:var(--serif);font-size:17px;color:var(--sable);letter-spacing:.5px;padding:4px 14px;background:none;border:none;cursor:pointer}
.fleche{background:none;border:none;padding:6px 8px;color:var(--or);line-height:0;cursor:pointer}
.filet{height:.5px;background:var(--or-fonce);margin:12px 24px 0}

.entete{padding:16px 16px 0;flex:none;text-align:center}
.entete .lab{font-size:11px;color:var(--or);letter-spacing:1.2px}
.entete .solde{font-family:var(--serif);font-size:40px;color:var(--creme);letter-spacing:-1px;margin:2px 0 0;line-height:1.15}
.jauge{height:2px;background:var(--carte2);border-radius:1px;margin:16px 6px 8px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--or);border-radius:1px;transition:width .3s,background .3s}
.jaugetxt{display:flex;justify-content:space-between;font-size:11px;color:var(--brun);letter-spacing:.4px;margin:0 6px 8px}
.badgeclos{font-size:11px;color:var(--or);letter-spacing:.8px;margin-top:4px}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 16px 100px}
section{display:none}
section.on{display:block}

.carte{background:var(--carte);border-radius:10px;overflow:hidden}
.carte2{background:var(--carte2);border:.5px solid var(--or-sombre);border-radius:10px}
.rav{padding:13px 16px;display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 18px}

function charger(){

  if(!S) S = { version:2, reglages:{plafond:600, retraite:745, cats:CATS_DEF}, notes:[], repli:true, mois:{} };
  normaliser();
}
function normaliser(){
  if(!S.reglages) S.reglages = {plafond:600, retraite:745, cats:CATS_DEF};
  if(!S.reglages.cats || S.reglages.cats.length !== CATS_DEF.length) S.reglages.cats = CATS_DEF;
  fusionnerSeuils();
  if(S.reglages.dette === undefined) S.reglages.dette = 0;
  if(!S.notes) S.notes = [];
  if(S.repli === undefined) S.repli = true;
  if(!S.mois) S.mois = {};
  migrer();
  if(!moisExistants().length) premierMois();
  rattraper();
}
function fusionnerSeuils(){
  var i, j, base;
  for(i=0;i<S.reglages.cats.length;i++){
    var c = S.reglages.cats[i], def = null;
    for(j=0;j<CATS_DEF.length;j++){ if(CATS_DEF[j].id === c.id) def = CATS_DEF[j]; }
    if(!def) continue;
    if(def.seuil !== undefined && c.seuil === undefined) c.seuil = def.seuil;
    if(def.seuilMin !== undefined && c.seuilMin === undefined) c.seuilMin = def.seuilMin;
    if(def.seuilMax !== undefined && c.seuilMax === undefined) c.seuilMax = def.seuilMax;
  }
}
function migrer(){
  if(S.version === 2) return;
  var cible = moisComptable(new Date()), k, i;
  var liste = moisExistants();
  for(i=0;i<liste.length;i++){
    k = liste[i];
    var m = S.mois[k];
    if(k > cible && (!m.lignes || !m.lignes.length)) delete S.mois[k];
  }
  liste = moisExistants();
  var prec = null;
  for(i=0;i<liste.length;i++){
    k = liste[i];
    if(S.mois[k].report === undefined){
      S.mois[k].report = (prec === null) ? (Number(S.reglages.reportInitial)||0) : solde(prec);
    }
    S.mois[k].clos = (k < cible);
    prec = k;
  }
  delete S.reglages.reportInitial;
  S.version = 2;
}

}

function premierK(){ var l = moisExistants(); return l.length ? l[0] : null; }

    S.mois[suiv] = { report:solde(k), retraite:m.retraite, passifs:p, lignes:[], clos:false };

function rattraper(){

function totalPassifs(k){

function sommeLignes(k){

function totauxCats(k){
  var m = S.mois[k], out = {}, i;
  for(i=0;i<S.reglages.cats.length;i++){ out[S.reglages.cats[i].id] = {sortie:0, entree:0}; }
  if(!m) return out;
  for(i=0;i<m.lignes.length;i++){
    var x = m.lignes[i];
    if(!out[x.cat]) out[x.cat] = {sortie:0, entree:0};
    if(x.montant < 0) out[x.cat].sortie += -x.montant; else out[x.cat].entree += x.montant;
  }
  return out;
}
function bilanMois(k){
  var m = S.mois[k];
  if(!m) return null;
  var t = totauxCats(k), cats = S.reglages.cats, i, c;
  var courant = 0, maxC = 0, sl = 0, el = 0;
  for(i=0;i<cats.length;i++){
    c = cats[i];
    var s = t[c.id].sortie;
    sl += s; el += t[c.id].entree;
    if(c.groupe === 'courant'){ courant += s; if(s > maxC) maxC = s; }
  }
  var pas = totalPassifs(k), rep = Number(m.report)||0;
  var sorties = sl + pas;
  var entrees = el + (Number(m.retraite)||0);
  return { t:t, courant:courant, maxC:maxC, passifs:pas, report:rep,
           sorties:sorties, entrees:entrees, ecart:entrees-sorties, solde:solde(k) };
}
function anneesClos(){

  for(i=0;i<l.length;i++){ if(S.mois[l[i]].clos) out[l[i].split('-')[0]] = 1; }
  var a = Object.keys(out); a.sort(); a.reverse();

function ecartAnnee(an){

function barreSeuil(v, seuil, couleur, bon){
  if(!seuil || seuil <= 0){
    return '<div class="piste"><i style="width:0%;background:'+couleur+'"></i></div>';
  }
  var pct = Math.max(0, Math.min(100, v/seuil*100));
  var grad = 'linear-gradient(to right,'+couleur+' 0%,'+couleur+' 45%,#EF9F27 68%,var(--rouge) 100%)';
  var h = '<div class="piste">';
  h += '<div style="position:absolute;left:0;top:0;height:100%;width:'+pct.toFixed(2)+'%;overflow:hidden;border-radius:1px">';
  h += '<div style="height:100%;width:'+(pct>0 ? (10000/pct).toFixed(1) : '100')+'%;background:'+grad+'"></div>';
  h += '</div>';
  if(v > seuil){
    var d = Math.min(30, Math.round((v-seuil)/seuil*100));
    h += '<i class="'+(bon?'depassebien':'depasse')+'" style="position:absolute;left:100%;width:'+d+'%;height:100%;border-radius:1px"></i>';
  }
  h += '</div>';
  return h;
}
function barreBipolaire(net, min, max, couleur){
  min = Number(min)||-1; max = Number(max)||1;
  var etendue = max - min;
  var pos = ((net - min) / etendue) * 100;
  pos = Math.max(-15, Math.min(115, pos));
  var zero = (0 - min) / etendue * 100;
  var gauche, larg, coul;
  if(net >= 0){ gauche = zero; larg = Math.min(pos,100) - zero; }
  else { gauche = Math.max(pos,0); larg = zero - gauche; }
  var horsBornes = (net < min) || (net > max);
  coul = horsBornes ? (net > max ? 'var(--vert)' : 'var(--rouge)') : couleur;
  var h = '<div class="pistebi">';
  h += '<div class="segb" style="left:'+gauche+'%;width:'+Math.max(0,larg)+'%;background:'+coul+'"></div>';
  h += '<span class="axe" style="left:'+zero+'%"></span>';
  h += '</div>';
  return h;
}

var courbeVue = 'annee', anneeCourbe = 0;
function bornesAnnees(){

  var mini = Math.min.apply(null, an.map(Number)), maxi = Math.max.apply(null, an.map(Number));

function pointsCourbe(){

function palierRond(v){
  var base = [1,2,2.5,5];
  var p = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
  var i;
  for(i=0;i<base.length;i++){
    var candidat = base[i]*p;
    if(v <= candidat*4) return candidat;
  }
  return 10*p;
}
function cheminLisse(pts, X, Y){
  var n = pts.length, d = '', i;
  if(n < 2) return '';
  var P = [];
  for(i=0;i<n;i++) P.push([X(i), Y(pts[i].e)]);
  d = 'M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);
  for(i=0;i<n-1;i++){
    var p0 = P[i-1] || P[i], p1 = P[i], p2 = P[i+1], p3 = P[i+2] || p2;
    var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    var c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  return d;
}
function dessinerCourbe(){
  var wrap = document.getElementById('courbewrap');
  if(!wrap) return;
  var bornes = bornesAnnees();
  if(bornes && !anneeCourbe) anneeCourbe = bornes.maxi;
  if(bornes){ anneeCourbe = Math.max(bornes.mini, Math.min(bornes.maxi, anneeCourbe)); }

  var h = '<div class="courbetabs">';
  h += '<div class="grp">'
     + '<button data-cv="annee" class="'+(courbeVue==='annee'?'on':'')+'">Année</button>'
     + '<button class="fan" id="an-moins" '+(!bornes||anneeCourbe<=bornes.mini?'disabled':'')+'>'+svg('gauche',15)+'</button>'
     + '<span class="an">'+(anneeCourbe||'—')+'</span>'
     + '<button class="fan" id="an-plus" '+(!bornes||anneeCourbe>=bornes.maxi?'disabled':'')+'>'+svg('droite',15)+'</button>'
     + '</div>';
  h += '<button data-cv="tout" class="'+(courbeVue==='tout'?'on':'')+'">Tout</button></div>';

  var pts = pointsCourbe();
  if(pts.length < 2){
    h += '<div class="vide" style="padding:18px 4px">Pas encore assez de mois clôturés.</div>';
    wrap.innerHTML = h;
    brancherCourbeTabs(wrap);
    return;
  }
  var W = 320, H = 190, padY = 20;
  var maxE = 0, i;
  for(i=0;i<pts.length;i++){ if(Math.abs(pts[i].e) > maxE) maxE = Math.abs(pts[i].e); }
  maxE = Math.max(maxE, 50);
  var pal = palierRond(maxE);
  var plafondEch = Math.ceil((maxE*1.15)/pal)*pal;
  var padGauche = 46, padDroite = 12;
  var n = pts.length;
  function X(i2){ return padGauche + (n===1?(W-padGauche-padDroite)/2:(i2/(n-1))*(W-padGauche-padDroite)); }
  function Y(v){ return H/2 - (v/plafondEch)*(H/2-padY); }

  var d = cheminLisse(pts, X, Y);
  var zoneHaut = 'M'+padGauche+','+(H/2)+' L'+padGauche+','+padY+' L'+(W-padDroite)+','+padY+' L'+(W-padDroite)+','+(H/2)+' Z';
  var zoneBas  = 'M'+padGauche+','+(H/2)+' L'+padGauche+','+(H-padY)+' L'+(W-padDroite)+','+(H-padY)+' L'+(W-padDroite)+','+(H/2)+' Z';
  var svgc = '<svg class="courbesvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    + '<path d="'+zoneHaut+'" fill="var(--vert)" opacity="0.06"/>'
    + '<path d="'+zoneBas+'" fill="var(--rouge)" opacity="0.06"/>';
  var paliers = [], pv;
  for(pv=0; pv<=plafondEch; pv+=pal){ paliers.push(pv); if(pv>0) paliers.push(-pv); }
  var pj;
  for(pj=0;pj<paliers.length;pj++){
    var pyv = paliers[pj], py = Y(pyv);
    svgc += '<line x1="'+padGauche+'" y1="'+py.toFixed(1)+'" x2="'+(W-padDroite)+'" y2="'+py.toFixed(1)+'" stroke="var(--or-sombre)" stroke-width="1" '+(pyv===0?'':'stroke-dasharray="2,4" opacity="0.35"')+'/>';
    svgc += '<text x="'+(padGauche-8)+'" y="'+(py+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--brun)">'+(pyv===0?'0':eur(pyv,0))+'</text>';
  }
  svgc += '<path d="'+d+'" fill="none" stroke="var(--or)" stroke-width="2"/>';
  var i2, montrerMois = (n <= 12);
  for(i2=0;i2<n;i2++){
    var xx = X(i2), yy = Y(pts[i2].e), bon = pts[i2].e >= 0;
    if(montrerMois || i2===0 || i2===n-1){
      svgc += '<text x="'+xx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--brun)">'+MOISCOURT[parseInt(pts[i2].k.split('-')[1],10)-1]+'</text>';
    }
    svgc += '<circle cx="'+xx.toFixed(1)+'" cy="'+yy.toFixed(1)+'" r="3" fill="'+(bon?'#C0DD97':'#F0997B')+'" stroke="var(--noir)" stroke-width="1"/>';
  }
  svgc += '</svg>';
  wrap.innerHTML = h + svgc;
  brancherCourbeTabs(wrap);
}
function brancherCourbeTabs(wrap){
  var btns = wrap.querySelectorAll('[data-cv]'), jj;
  for(jj=0;jj<btns.length;jj++){ btns[jj].addEventListener('click', function(){ courbeVue = this.getAttribute('data-cv'); dessinerCourbe(); }); }
  var am = document.getElementById('an-moins');
  if(am) am.addEventListener('click', function(){ anneeCourbe--; dessinerCourbe(); });
  var ap = document.getElementById('an-plus');

var dg = {actif:false, idx:-1, y0:0, hauteur:56, timer:null, el:null};
function brancherGlisser(){
  var zone = document.getElementById('s-passifs');
  var rows = zone.querySelectorAll('.pdrag'), i;
  for(i=0;i<rows.length;i++){
    rows[i].addEventListener('touchstart', debutGlisser, {passive:true});
    rows[i].addEventListener('touchmove', pendantGlisser, {passive:false});
    rows[i].addEventListener('touchend', finGlisser, {passive:true});
    rows[i].addEventListener('touchcancel', finGlisser, {passive:true});
  }
}
function debutGlisser(e){
  if(e.touches.length !== 1) return;
  var el = e.currentTarget;
  dg.y0 = e.touches[0].clientY;
  dg.hauteur = el.offsetHeight || 56;
  clearTimeout(dg.timer);
  dg.timer = setTimeout(function(){
    dg.actif = true;
    dg.idx = parseInt(el.getAttribute('data-idx'),10);
    dg.el = el;
    el.classList.add('attrape');
    if(navigator.vibrate) try { navigator.vibrate(18); } catch(err){}
  }, 420);
}
function pendantGlisser(e){
  if(!dg.actif){
    if(Math.abs(e.touches[0].clientY - dg.y0) > 8) clearTimeout(dg.timer);
    return;
  }
  e.preventDefault();
  var d = e.touches[0].clientY - dg.y0;
  var pas = Math.round(d / dg.hauteur);
  if(pas === 0) return;
  var m = S.mois[moisCourant];
  var cible = Math.max(0, Math.min(m.passifs.length-1, dg.idx + pas));
  if(cible === dg.idx) return;
  var item = m.passifs.splice(dg.idx,1)[0];
  m.passifs.splice(cible,0,item);
  dg.idx = cible;
  dg.y0 = e.touches[0].clientY;
  rendrePassifs();
  var nv = document.querySelector('#s-passifs .pdrag[data-idx="'+cible+'"]');
  if(nv){ nv.classList.add('attrape'); dg.el = nv; }
}
function finGlisser(){
  clearTimeout(dg.timer);
  if(dg.actif){
    if(dg.el) dg.el.classList.remove('attrape');
    sauver(); rendrePassifs(); toast('Ordre enregistré');
  }
  dg.actif = false; dg.idx = -1; dg.el = null;
}
function deplacerPassif(id, sens){
  var m = S.mois[moisCourant], i, pos = -1;
  for(i=0;i<m.passifs.length;i++){ if(m.passifs[i].id === id) pos = i; }
  var cible = pos + sens;
  if(pos < 0 || cible < 0 || cible >= m.passifs.length) return;
  var item = m.passifs.splice(pos,1)[0];
  m.passifs.splice(cible,0,item);
  sauver(); rendre(); toast('Déplacé');
}

function enregistrerLigne(){
  var t = document.getElementById('tiroir');
  var brut = document.getElementById('f-montant').value.replace(/\s/g,'').replace(',','.');
  var v = parseFloat(brut);
  if(!brut || isNaN(v) || v <= 0){ document.getElementById('f-montant').style.borderColor = 'var(--alerte)'; return; }
  var montant = t.dataset.sens === 'sortie' ? -Math.abs(v) : Math.abs(v);
  var lib = document.getElementById('f-lib').value.trim() || cat(t.dataset.cat).nom;
  var date = document.getElementById('f-date').value || (clefMois(new Date())+'-01');
  var m = S.mois[moisCourant], i;

  if(edition){
    for(i=0;i<m.lignes.length;i++){
      if(m.lignes[i].id === edition){
        m.lignes[i].montant = montant; m.lignes[i].libelle = lib;
        m.lignes[i].cat = t.dataset.cat; m.lignes[i].date = date;
      }
    }
  } else {
    var kd = moisDeDate(date);
    var cible = S.mois[kd] ? kd : dernierK();
    S.mois[cible].lignes.push({id:uid(), date:date, libelle:lib, montant:montant, cat:t.dataset.cat, valide:false, ordre:Date.now()});
    if(cible !== moisCourant){ moisCourant = cible; toast('Ligne rangée dans '+libMois(cible)); }
    pageMois = 0;
  }
  sauver(); rendre(); toast('Enregistré');
  if(!edition){
    document.getElementById('f-montant').value = '';
    document.getElementById('f-lib').value = '';
    setTimeout(function(){ var f = document.getElementById('f-montant'); if(f) f.focus(); }, 60);
  }
}
function supprimerLigne(){
  var m = S.mois[moisCourant], garde = [], i;
  for(i=0;i<m.lignes.length;i++){ if(m.lignes[i].id !== edition) garde.push(m.lignes[i]); }
  m.lignes = garde;
  sauver(); fermerEtRevenir(); rendre();
}

  document.getElementById('cf-oui').addEventListener('click', function(){
    var m = S.mois[moisCourant], i;
    for(i=0;i<m.lignes.length;i++){ if(m.lignes[i].id === id) m.lignes[i].valide = false; }
    sauver(); fermerEtRevenir(); rendre();
    if(pourModifier) setTimeout(function(){ ouvrirLigne(id); }, 300);
  });
}
function basculerLigne(id){
  var m = S.mois[moisCourant], i, x = null;
  for(i=0;i<m.lignes.length;i++){ if(m.lignes[i].id === id) x = m.lignes[i]; }
  if(!x) return;
  if(x.valide){ confirmerDecochage(id, false); return; }
  x.valide = true; sauver(); rendreMois();
}
function basculerPassif(id){
  var m = S.mois[moisCourant], i;
  for(i=0;i<m.passifs.length;i++){ if(m.passifs[i].id === id) m.passifs[i].passe = !m.passifs[i].passe; }
  sauver(); rendrePassifs();
}

function demanderCloture(){
  var s = solde(moisCourant), suiv = moisDecale(moisCourant,1);
  var h = '<h2>Clôturer '+libMois(moisCourant)+'</h2><div class="filet"></div>'
    + '<div class="txt">Le solde de '+eur(s,0)+' sera reporté sur '+libMois(suiv)+',<br>'
    + 'et les passifs y seront recopiés.<br><br>Un mois clôturé ne se rouvre pas.</div>'
    + '<div class="actions"><button id="cl-non">Annuler</button><button class="plein" id="cl-oui">Clôturer</button></div>';
  ouvrirTiroir(h);
  document.getElementById('cl-non').addEventListener('click', fermerEtRevenir);
  document.getElementById('cl-oui').addEventListener('click', function(){
    cloturer(moisCourant);
    moisCourant = moisDecale(moisCourant,1);
    fermerEtRevenir(); rendre(); toast('Mois clôturé');
  });
}

function ouvrirPassif(id){
  var m = S.mois[moisCourant];
  if(!m) return;
  var p = null, i;
  for(i=0;i<m.passifs.length;i++){ if(m.passifs[i].id === id) p = m.passifs[i]; }
  edition = p ? p.id : null;
  var h = '<h2>'+(p?'Modifier le passif':'Nouveau passif')+'</h2><div class="filet"></div>';
  h += '<div class="champ"><label>Nom</label><input type="text" id="p-nom" value="'+(p?echap(p.nom):'')+'" placeholder="Netflix"></div>';
  h += '<div class="champ"><label>Montant mensuel</label><input type="text" inputmode="decimal" id="p-montant" value="'+(p?String(p.montant).replace('.',','):'')+'" placeholder="15"></div>';
  if(p){
    h += '<div class="fleches"><button id="p-haut">'+svg('flechehaut',18)+'</button>'
       + '<button id="p-bas">'+svg('flechebas',18)+'</button></div>';
  }
  h += '<div class="actions">'+(p?'<button class="danger" id="p-suppr">'+svg('croix',18)+'</button>':'')
     + '<button class="plein" id="p-ok">Enregistrer</button></div>';
  h += '<div class="note2">Le passif se reporte sur les mois suivants. Les mois déjà clôturés ne bougent pas.</div>';
  ouvrirTiroir(h);
  document.getElementById('p-ok').addEventListener('click', function(){
    var nom = document.getElementById('p-nom').value.trim();
    var v = parseFloat(document.getElementById('p-montant').value.replace(',','.'));
    if(!nom || isNaN(v)){ document.getElementById('p-nom').style.borderColor = 'var(--alerte)'; return; }
    var mm = S.mois[moisCourant], j;
    if(edition){
      for(j=0;j<mm.passifs.length;j++){ if(mm.passifs[j].id === edition){ mm.passifs[j].nom = nom; mm.passifs[j].montant = v; } }
    } else { mm.passifs.push({id:uid(), nom:nom, montant:v, passe:false}); }
    sauver(); rendre(); toast('Enregistré');
    if(!edition){
      document.getElementById('p-nom').value = '';
      document.getElementById('p-montant').value = '';
      setTimeout(function(){ var f = document.getElementById('p-nom'); if(f) f.focus(); }, 60);
    }
  });
  var ph = document.getElementById('p-haut');
  if(ph) ph.addEventListener('click', function(){ deplacerPassif(edition,-1); });
  var pb = document.getElementById('p-bas');
  if(pb) pb.addEventListener('click', function(){ deplacerPassif(edition,1); });
  var sp = document.getElementById('p-suppr');
  if(sp) sp.addEventListener('click', function(){
    var mm = S.mois[moisCourant], garde = [], j;
    for(j=0;j<mm.passifs.length;j++){ if(mm.passifs[j].id !== edition) garde.push(mm.passifs[j]); }
    mm.passifs = garde; sauver(); fermerEtRevenir(); rendre();
  });
}

function ouvrirReglages(){
  dessinerReglagesPrincipal();
  empiler('tiroir');
  document.getElementById('tiroir').classList.add('on');
  document.getElementById('voile').classList.add('on');
  tiroirOuvert = true;
}
function dessinerReglagesPrincipal(){
  var m = S.mois[moisCourant], i;
  var h = '<h2>Réglages</h2><div class="filet"></div>';
  if(m){
    h += '<div class="sstitre">'+libMois(moisCourant)+'</div>';
    h += '<div class="reg"><span>Retraite</span><input type="text" inputmode="decimal" id="r-retraite" value="'+m.retraite+'"></div>';
    var etiq = (moisCourant === premierK()) ? 'Solde de départ' : 'Reporté du mois passé';
    if(!m.clos){
      var rv = Number(m.report)||0, neg = rv < 0;
      h += '<div class="champ" style="margin-top:14px"><label>'+etiq+'</label>'
         + '<div class="sens" style="margin-bottom:10px">'
         + '<button data-rep="moins" class="'+(neg?'on':'')+'">Découvert</button>'
         + '<button data-rep="plus" class="'+(neg?'':'on')+'">Positif</button></div>'
         + '<input type="text" inputmode="decimal" id="r-report" value="'+Math.abs(rv)+'"></div>';
    } else {
      h += '<div class="reg"><span>'+etiq+'</span><b class="num">'+eur(Number(m.report)||0,0)+'</b></div>';
    }
  }
  h += '<div class="reg"><span>Découvert autorisé</span><input type="text" inputmode="decimal" id="r-plafond" value="'+S.reglages.plafond+'"></div>';
  h += '<div class="reg"><span>Dette (hors calculs)</span><input type="text" inputmode="decimal" id="r-dette" value="'+(Number(S.reglages.dette)||0)+'"></div>';
  h += '<div class="rang" id="r-cats" style="margin-top:16px;background:var(--carte);border-radius:10px;padding:12px 15px;cursor:pointer"><span>Catégories</span>'
     + '<span style="line-height:0;color:var(--or-sombre)">'+svg('droite',16)+'</span></div>';
  h += '<div class="actions"><button id="r-export">Exporter</button><button id="r-import">Importer</button></div>';
  h += '<div class="actions"><button class="plein" id="r-ok">Enregistrer</button></div>';
  h += '<div class="note2">Le report se corrige tant que le mois n\'est pas clôturé. Le mois comptable se clôture le '+JOURCLOTURE+'. Après cette date, les saisies vont sur le mois suivant. La dette n\'entre dans aucun calcul, elle est juste gardée en mémoire. L\'export enregistre une sauvegarde de tous tes mois.</div>';
  document.getElementById('tiroir').innerHTML = h;

  document.getElementById('r-ok').addEventListener('click', function(){
    var mm = S.mois[moisCourant], v, j;
    if(mm){
      var rr = document.getElementById('r-retraite');
      if(rr){ v = parseFloat(rr.value.replace(',','.')); if(!isNaN(v)) mm.retraite = v; }
      var rp = document.getElementById('r-report');
      if(rp){
        v = parseFloat(rp.value.replace(',','.'));
        if(!isNaN(v)) mm.report = (document.getElementById('tiroir').dataset.rep === 'moins') ? -Math.abs(v) : Math.abs(v);
      }
    }
    v = parseFloat(document.getElementById('r-plafond').value.replace(',','.'));
    if(!isNaN(v)) S.reglages.plafond = v;
    var rd = document.getElementById('r-dette');
    if(rd){ v = parseFloat(rd.value.replace(',','.')); if(!isNaN(v)) S.reglages.dette = v; }
    sauver(); rendre(); toast('Enregistré');
  });
  document.getElementById('r-export').addEventListener('click', exporter);
  document.getElementById('r-import').addEventListener('click', importer);
  document.getElementById('r-cats').addEventListener('click', dessinerReglagesCategories);
  var tr = document.getElementById('tiroir');
  tr.dataset.rep = (m && (Number(m.report)||0) < 0) ? 'moins' : 'plus';
  var rb = tr.querySelectorAll('[data-rep]');
  for(i=0;i<rb.length;i++){
    rb[i].addEventListener('click', function(){
      var bb = tr.querySelectorAll('[data-rep]');
      for(var j=0;j<bb.length;j++) bb[j].classList.remove('on');
      this.classList.add('on'); tr.dataset.rep = this.getAttribute('data-rep');
    });
  }
}
function dessinerReglagesCategories(){
  var h = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:2px">'
    + '<button id="rc-retour" style="background:none;border:none;color:var(--or);line-height:0;padding:4px;cursor:pointer">'+svg('gauche',20)+'</button>'
    + '<h2 style="flex:1;margin:0">Catégories</h2></div><div class="filet"></div>';
  var i;
  for(i=0;i<S.reglages.cats.length;i++){
    var c = S.reglages.cats[i];
    h += '<div class="champ" style="margin-bottom:16px">'
       + '<div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">'
       + svg(c.ico,19,c.couleur) + '<input type="text" data-catnom="'+c.id+'" value="'+echap(c.nom)+'" style="flex:1"></div>';
    if(c.id === 'domaine'){
      h += '<div style="display:flex;gap:9px">'
         + '<div style="flex:1"><label style="display:block;font-size:10px;color:var(--brun);margin-bottom:4px">limite découvert</label>'
         + '<input type="text" inputmode="decimal" data-seuilmin="'+c.id+'" value="'+Math.abs(c.seuilMin||0)+'"></div>'
         + '<div style="flex:1"><label style="display:block;font-size:10px;color:var(--brun);margin-bottom:4px">objectif recettes</label>'
         + '<input type="text" inputmode="decimal" data-seuilmax="'+c.id+'" value="'+(c.seuilMax||0)+'"></div></div>';
    } else if(c.seuil !== undefined){
      h += '<label style="display:block;font-size:10px;color:var(--brun);margin-bottom:4px">seuil mensuel</label>'
         + '<input type="text" inputmode="decimal" data-seuil="'+c.id+'" value="'+c.seuil+'">';
    } else {
      h += '<div class="note2" style="margin:0">sans limite</div>';
    }
    h += '</div>';
  }
  h += '<div class="actions"><button class="plein" id="rc-ok">Enregistrer</button></div>';
  document.getElementById('tiroir').innerHTML = h;
  document.getElementById('rc-retour').addEventListener('click', dessinerReglagesPrincipal);
  document.getElementById('rc-ok').addEventListener('click', function(){
    var noms = document.querySelectorAll('[data-catnom]'), j, q;
    for(j=0;j<noms.length;j++){
      var id = noms[j].getAttribute('data-catnom'), val = noms[j].value.trim();
      if(val){ for(q=0;q<S.reglages.cats.length;q++){ if(S.reglages.cats[q].id === id) S.reglages.cats[q].nom = val; } }
    }
    var seuils = document.querySelectorAll('[data-seuil]');
    for(j=0;j<seuils.length;j++){
      var id2 = seuils[j].getAttribute('data-seuil'), v2 = parseFloat(seuils[j].value.replace(',','.'));
      if(!isNaN(v2)){ for(q=0;q<S.reglages.cats.length;q++){ if(S.reglages.cats[q].id === id2) S.reglages.cats[q].seuil = v2; } }
    }
    var smin = document.querySelectorAll('[data-seuilmin]');
    for(j=0;j<smin.length;j++){
      var id3 = smin[j].getAttribute('data-seuilmin'), v3 = parseFloat(smin[j].value.replace(',','.'));
      if(!isNaN(v3)){ for(q=0;q<S.reglages.cats.length;q++){ if(S.reglages.cats[q].id === id3) S.reglages.cats[q].seuilMin = -Math.abs(v3); } }
    }
    var smax = document.querySelectorAll('[data-seuilmax]');
    for(j=0;j<smax.length;j++){
      var id4 = smax[j].getAttribute('data-seuilmax'), v4 = parseFloat(smax[j].value.replace(',','.'));
      if(!isNaN(v4)){ for(q=0;q<S.reglages.cats.length;q++){ if(S.reglages.cats[q].id === id4) S.reglages.cats[q].seuilMax = Math.abs(v4); } }
    }
    sauver(); rendre(); toast('Enregistré');
    dessinerReglagesPrincipal();
  });
}

function exporter(){
  var blob = new Blob([JSON.stringify(S)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'comptes-'+clefMois(new Date())+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('Sauvegarde enregistrée');
}
function importer(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.addEventListener('change', function(){
    var f = inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var d = JSON.parse(r.result);
        if(!d.mois) throw new Error('format');
        S = d;
        normaliser();
        sauver(); fermerEtRevenir();
        moisCourant = moisComptable(new Date());
        if(!S.mois[moisCourant]) moisCourant = dernierK();
        rendre(); toast('Sauvegarde restaurée');
      } catch(e){ toast("Fichier non reconnu"); }
    };
    r.readAsText(f);
  });
  inp.click();
}

function init(){
  charger();
  moisCourant = moisComptable(new Date());
  if(!S.mois[moisCourant]) moisCourant = dernierK();
  document.getElementById('i-mois').innerHTML = svg('liste',20);
  document.getElementById('i-bilan').innerHTML = svg('barres',20);
  document.getElementById('i-passifs').innerHTML = svg('boucle',20);
  document.getElementById('i-reglages').innerHTML = svg('roue',20);
  document.getElementById('prevm').innerHTML = svg('gauche',18);
  document.getElementById('nextm').innerHTML = svg('droite',18);
  rendre();

  document.getElementById('prevm').addEventListener('click', function(){ moisCourant = moisDecale(moisCourant,-1); rendre(); });
  document.getElementById('nextm').addEventListener('click', function(){ moisCourant = moisDecale(moisCourant,1); rendre(); });
  document.getElementById('moistitre').addEventListener('click', ouvrirMoisPicker);
  document.getElementById('t-mois').addEventListener('click', function(){ allerOnglet('mois'); });
  document.getElementById('t-bilan').addEventListener('click', function(){ allerOnglet('bilan'); });
  document.getElementById('t-passifs').addEventListener('click', function(){ allerOnglet('passifs'); });
  document.getElementById('t-reglages').addEventListener('click', ouvrirReglages);
  document.getElementById('voile').addEventListener('click', fermerEtRevenir);

  document.getElementById('main').addEventListener('click', function(e){
    if(!e.target.closest) return;
    var el;
    if((el = e.target.closest('[data-coche]'))){ basculerLigne(el.getAttribute('data-coche')); return; }
    if((el = e.target.closest('[data-passif]'))){ basculerPassif(el.getAttribute('data-passif')); return; }
    if((el = e.target.closest('[data-passifedit]'))){ ouvrirPassif(el.getAttribute('data-passifedit')); return; }
    if((el = e.target.closest('[data-edit]'))){ ouvrirLigne(el.getAttribute('data-edit')); return; }
    if((el = e.target.closest('[data-supnote]'))){ supprimerNote(el.getAttribute('data-supnote')); return; }
    if((el = e.target.closest('[data-note]'))){ basculerNote(el.getAttribute('data-note')); return; }
    if((el = e.target.closest('[data-annee]'))){ ouvrirAnnee(el.getAttribute('data-annee')); return; }
  });
  document.getElementById('tiroir').addEventListener('click', function(e){
    if(!e.target.closest) return;
    var ed = e.target.closest('[data-detail]');
    if(ed){ ouvrirDetail(ed.getAttribute('data-detail')); return; }
    var el = e.target.closest('[data-mois]');
    if(el){
      var k = el.getAttribute('data-mois');
      if(!S.mois[k]){ toast('Mois pas encore ouvert'); return; }
      moisCourant = k; fermerEtRevenir(); rendre();
    }
  });

  var x0 = 0, y0 = 0, suivi = false, zone = document.getElementById('main');
  zone.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1){ suivi = false; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; suivi = true;
  }, {passive:true});
  zone.addEventListener('touchend', function(e){
    if(!suivi || tiroirOuvert) return;
    suivi = false;
    var t = e.changedTouches[0], dx = t.clientX-x0, dy = t.clientY-y0;
    if(Math.abs(dx) < 70 || Math.abs(dy) > 45) return;
    var ordre = ['mois','bilan','passifs'], i = ordre.indexOf(onglet);
    if(dx < 0 && i < ordre.length-1) allerOnglet(ordre[i+1]);
    if(dx > 0 && i > 0) allerOnglet(ordre[i-1]);
  }, {passive:true});

  try { history.replaceState({p:'base'}, ''); history.pushState({p:'garde'}, ''); } catch(e){}
  window.addEventListener('popstate', function(){
    if(tiroirOuvert){ fermerTiroir(); return; }
    if(onglet !== 'mois'){ allerOnglet('mois', true); return; }
    if(!quitArme){
      quitArme = true; empiler('garde'); toast('Appuie encore pour quitter');
      setTimeout(function(){ quitArme = false; }, 2200);
      return;
    }
    try { history.back(); } catch(e){}
  });
}
function basculerNote(id){
  for(var i=0;i<S.notes.length;i++){ if(S.notes[i].id === id) S.notes[i].fait = !S.notes[i].fait; }
  sauver(); rendre();
}
function supprimerNote(id){
  var garde = [];
  for(var i=0;i<S.notes.length;i++){ if(S.notes[i].id !== id) garde.push(S.notes[i]); }
  S.notes = garde; sauver(); rendre();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

init();
</script>
</body>
</html>

<style>
:root{
  --noir:#251206; --carte:#331A09; --carte2:#3A1D0C; --trait:#4A2A13;
  --or:#B8934E; --or-fonce:#8A6A34; --or-sombre:#6B4C24;
  --creme:#F2E6D0; --creme2:#EEDFC4; --sable:#E8D6B8; --brun:#96784F;
  --vert:#C0DD97; --rouge:#F0997B; --alerte:#E24B4A;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--noir);color:var(--creme2);font-family:var(--sans);font-size:15px;overscroll-behavior:none}
.num{font-family:var(--serif);font-weight:400}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
input{background:var(--noir);border:.5px solid var(--or-sombre);border-radius:8px;padding:11px 12px;width:100%;outline:none}
input:focus{border-color:var(--or)}
input[type=date]{-webkit-appearance:none}

#app{display:flex;flex-direction:column;height:100%}

header{padding:16px 16px 0;flex:none}
.moisnav{display:flex;align-items:center;justify-content:center;gap:6px}
.moisnav .titre{font-family:var(--serif);font-size:17px;color:var(--sable);letter-spacing:.5px;min-width:150px;text-align:center}
.fleche{background:none;border:none;padding:6px 8px;color:var(--or);line-height:0;cursor:pointer}
.filet{height:.5px;background:var(--or-fonce);margin:12px 24px 0}

.entete{padding:16px 16px 12px;flex:none;text-align:center}
.entete .lab{font-size:11px;color:var(--or);letter-spacing:1.2px}
.entete .solde{font-family:var(--serif);font-size:40px;color:var(--creme);letter-spacing:-1px;margin-top:2px;line-height:1.1}
.jauge{height:2px;background:var(--carte2);border-radius:1px;margin:16px 6px 8px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--or);border-radius:1px;transition:width .3s,background .3s}
.jaugetxt{display:flex;justify-content:space-between;font-size:11px;color:var(--brun);letter-spacing:.4px;margin:0 6px}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 16px 100px}
section{display:none}
section.on{display:block}

.carte{background:var(--carte);border-radius:10px;overflow:hidden}
.carte2{background:var(--carte2);border:.5px solid var(--or-sombre);border-radius:10px}
.rav{padding:13px 16px;display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 18px}
.rav span{font-size:13px;color:#B49872}
.rav b{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--creme)}

.ligne{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:.5px solid var(--trait)}
.ligne:last-child{border-bottom:none}
.ligne.valide{opacity:.42}
.coche{background:none;border:none;padding:0;line-height:0;color:var(--or-sombre);flex:none;cursor:pointer}
.ligne.valide .coche{color:var(--or)}
.ico{flex:none;line-height:0}
.corps{flex:1;min-width:0;overflow:hidden}
.corps .lib{font-size:14px;color:var(--creme2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corps .meta{font-size:11px;color:var(--brun);letter-spacing:.3px;margin-top:1px}
.mont{font-family:var(--serif);font-size:17px;color:var(--creme);flex:none}
.mont.plus{color:var(--vert)}

.vide{text-align:center;color:var(--brun);font-size:13px;padding:34px 20px;line-height:1.7}

.bouton{display:block;margin:20px auto 0;border:.5px solid var(--or-fonce);background:none;border-radius:20px;padding:9px 22px;font-size:13px;color:var(--sable);cursor:pointer}
.bouton:active{background:var(--carte2)}

nav{flex:none;display:flex;border-top:.5px solid var(--trait);padding:12px 0 max(14px,env(safe-area-inset-bottom));background:var(--noir)}
nav button{flex:1;background:none;border:none;color:#7A5C33;line-height:1;cursor:pointer;padding:0}
nav button.on{color:var(--sable)}
nav button div{font-size:10px;margin-top:4px;letter-spacing:.6px}

.sstitre{font-size:11px;color:var(--or);letter-spacing:1px;margin:0 4px 9px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.bloc{background:var(--carte);border-radius:10px;padding:13px;text-align:center}
.bloc .l{font-size:11px;color:var(--or);letter-spacing:.8px}
.bloc .v{font-family:var(--serif);font-size:23px;color:var(--creme);margin-top:2px}
.ecart{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ecart .v{font-family:var(--serif);font-size:20px}
.ecart .p{font-size:11px;color:#B49872;letter-spacing:.3px;margin-top:2px}

.barre{margin-bottom:13px}
.barre .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.barre .t span{font-size:13px;color:var(--creme2);display:flex;align-items:center;gap:7px}
.barre .t b{font-family:var(--serif);font-weight:400;font-size:15px;color:var(--creme);display:flex;align-items:center;gap:4px}
.piste{height:2px;background:var(--trait);border-radius:1px;overflow:hidden}
.piste i{display:block;height:100%;border-radius:1px}
.pad{padding:15px 15px 4px}

.rang{display:flex;justify-content:space-between;align-items:baseline;padding:12px 15px;border-bottom:.5px solid var(--trait)}
.rang:last-child{border-bottom:none}
.rang span{font-size:13px;color:var(--creme2);display:flex;align-items:center;gap:7px}
.rang b{font-family:var(--serif);font-weight:400;font-size:15px;color:var(--creme)}
.pied{border-top:.5px solid var(--trait);margin-top:18px;padding-top:14px;display:flex;justify-content:space-between;font-size:12px;color:var(--brun);letter-spacing:.3px}

.grostotal{text-align:center;margin-bottom:22px}
.grostotal .l{font-size:11px;color:var(--or);letter-spacing:1.2px}
.grostotal .v{font-family:var(--serif);font-size:36px;color:var(--creme);margin-top:2px}
.grostotal .s{font-size:12px;color:var(--brun);margin-top:4px}

.voile{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.voile.on{opacity:1;pointer-events:auto}
.tiroir{position:fixed;left:0;right:0;bottom:0;background:var(--noir);border-top:.5px solid var(--or-fonce);border-radius:16px 16px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .25s ease;z-index:50;max-height:92%;overflow-y:auto}
.tiroir.on{transform:translateY(0)}
.tiroir h2{font-family:var(--serif);font-weight:400;font-size:17px;color:var(--sable);text-align:center;margin:0 0 4px}
.tiroir .filet{margin:12px 24px 18px}
.champ{margin-bottom:14px}
.champ label{display:block;font-size:11px;color:var(--or);letter-spacing:.8px;margin-bottom:6px}
.sens{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sens button{padding:11px;border-radius:8px;border:.5px solid var(--or-sombre);background:none;color:var(--brun);cursor:pointer}
.sens button.on{border-color:var(--or);color:var(--creme);background:var(--carte)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cats button{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;border:.5px solid transparent;background:var(--carte);color:var(--creme2);font-size:13px;text-align:left;cursor:pointer}
.cats button.on{border-color:var(--or)}
.cats button span{line-height:0;flex:none}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;padding:13px;border-radius:22px;border:.5px solid var(--or-fonce);background:none;color:var(--sable);cursor:pointer}
.actions button.plein{background:var(--or);border-color:var(--or);color:#2A1408;font-weight:500}
.actions button.danger{border-color:#7A3A2A;color:var(--rouge);flex:0 0 52px}
.lienrouge{display:block;width:100%;margin-top:16px;background:none;border:none;color:var(--rouge);font-size:13px;padding:8px;cursor:pointer}
.reg{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:.5px solid var(--trait)}
.reg span{font-size:14px}
.reg input{width:110px;text-align:right;padding:8px 10px}
.reg input.nom{width:150px;text-align:left}
.note{font-size:12px;color:var(--brun);line-height:1.6;margin:14px 2px 0}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="moisnav">
      <button class="fleche" id="prevm" aria-label="Mois précédent"></button>
      <div class="titre" id="moistitre">—</div>
      <button class="fleche" id="nextm" aria-label="Mois suivant"></button>
    </div>
    <div class="filet"></div>
  </header>

  <div class="entete">
    <div class="lab" id="entlab">solde</div>
    <div class="solde num" id="soldeval">—</div>
    <div class="jauge"><i id="jaugebar" style="width:0%"></i></div>
    <div class="jaugetxt"><span id="jaugeg">—</span><span id="jauged">—</span></div>
  </div>

  <main id="main">
    <section id="s-mois" class="on">
      <div class="carte2 rav"><span>Reste à vivre du mois</span><b class="num" id="ravval">—</b></div>
      <div class="carte" id="lignes"></div>
      <button class="bouton" id="ajouter">+ Ajouter</button>
    </section>

    <section id="s-bilan"></section>
    <section id="s-passifs"></section>
  </main>

  <nav>
    <button id="t-mois" class="on"><span id="i-mois"></span><div>Mois</div></button>
    <button id="t-bilan"><span id="i-bilan"></span><div>Bilan</div></button>
    <button id="t-passifs"><span id="i-passifs"></span><div>Passifs</div></button>
    <button id="t-reglages"><span id="i-reglages"></span><div>Réglages</div></button>
  </nav>
</div>

<div class="voile" id="voile"></div>
<div class="tiroir" id="tiroir"></div>

<script>
var ICO = {
  panier:'<path d="M4 8h16l-1.6 10.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  volant:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3.5v6M4.3 15.2l5.3-2.2M19.7 15.2l-5.3-2.2"/>',
  flamme:'<path d="M12 3c3 3.4 5 6 5 9a5 5 0 0 1-10 0c0-1.6.7-3 2-4.4.3 1.4 1 2.2 1.8 2.4C10.4 8 10.8 5.6 12 3z"/>',
  etoile:'<path d="M12 3.5c.6 4.4 1.6 5.4 6 6-4.4.6-5.4 1.6-6 6-.6-4.4-1.6-5.4-6-6 4.4-.6 5.4-1.6 6-6z"/><path d="M18.5 15.5c.3 1.7.6 2 2.3 2.3-1.7.3-2 .6-2.3 2.3-.3-1.7-.6-2-2.3-2.3 1.7-.3 2-.6 2.3-2.3z"/>',
  maison:'<path d="M3.5 10.6 12 4l8.5 6.6"/><path d="M5.6 12.2V19a1 1 0 0 0 1 1h10.8a1 1 0 0 0 1-1v-6.8"/><path d="M10 20v-4.6h4V20"/>',
  pain:'<path d="M5.6 17.2 16.4 6.4a3.4 3.4 0 0 1 4.8 4.8L10.4 22"/><path d="M5.6 17.2 3 21l3.5-1.1"/><path d="M11 11.6l1.8 1.8M14 8.6l1.8 1.8"/>',
  livre:'<path d="M5 4.5h9.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M8 20a3 3 0 0 1 3-3h6.5"/><path d="M8.5 8.5h6"/>',
  points:'<circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>',
  case:'<rect x="4.5" y="4.5" width="15" height="15" rx="3.5"/>',
  coche:'<rect x="4.5" y="4.5" width="15" height="15" rx="3.5"/><path d="M8.6 12.2l2.4 2.4 4.4-5"/>',
  gauche:'<path d="M14.5 5.5 8 12l6.5 6.5"/>',
  droite:'<path d="M9.5 5.5 16 12l-6.5 6.5"/>',
  liste:'<path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4" cy="6.5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17.5" r="1"/>',
  barres:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
  boucle:'<path d="M4 8h13l-2.5-2.5M20 16H7l2.5 2.5"/>',
  roue:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6"/>',
  hausse:'<path d="M4 16.5 10 10l3.5 3.5L20 7"/><path d="M15.5 7H20v4.5"/>',
  baisse:'<path d="M4 7.5 10 14l3.5-3.5L20 17"/><path d="M15.5 17H20v-4.5"/>',
  fleched:'<path d="M8 8h8v8"/><path d="M8 16 16 8"/>',
  flecheb:'<path d="M8 16h8V8"/><path d="M8 8l8 8"/>',
  crayon:'<path d="M5 19h3l9.5-9.5a2.1 2.1 0 0 0-3-3L5 16z"/>'
};
function svg(n,s,c){
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+ICO[n]+'</svg>';
}

var CATS_DEF = [
  {id:'courses',    nom:'Courses',     ico:'panier', couleur:'#C0DD97', barre:'#97C459', groupe:'courant'},
  {id:'route',      nom:'Route',       ico:'volant', couleur:'#B5D4F4', barre:'#85B7EB', groupe:'courant'},
  {id:'tabac',      nom:'Tabac/CBD',   ico:'flamme', couleur:'#D3D1C7', barre:'#B4B2A9', groupe:'courant'},
  {id:'perso',      nom:'Pour moi',    ico:'etoile', couleur:'#F4C0D1', barre:'#ED93B1', groupe:'courant'},
  {id:'gourmand',   nom:'Gourmandise', ico:'pain',   couleur:'#FAC775', barre:'#EF9F27', groupe:'courant'},
  {id:'domaine',    nom:'Le domaine',  ico:'maison', couleur:'#9FE1CB', barre:'#5DCAA5', groupe:'autre'},
  {id:'livres',     nom:'Les livres',  ico:'livre',  couleur:'#CECBF6', barre:'#AFA9EC', groupe:'autre'},
  {id:'reste',      nom:'Le reste',    ico:'points', couleur:'#F5C4B3', barre:'#F0997B', groupe:'autre'}
];
var PASSIFS_DEF = [
  {nom:'Macif',        montant:40},
  {nom:'Mutuelle',     montant:29},
  {nom:'Bouygues',     montant:53},
  {nom:'SFR',          montant:14},
  {nom:'Assurtel',     montant:10},
  {nom:'Netflix',      montant:15},
  {nom:'Basic Fit',    montant:32},
  {nom:'Amazon Music', montant:12}
];
var MOISNOM = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var CLE = 'comptes-v1';

var S = null, moisCourant = null, onglet = 'mois', tiroirOuvert = false, edition = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clefMois(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function libMois(k){ var p=k.split('-'); return MOISNOM[parseInt(p[1],10)-1]+' '+p[0]; }
function moisDecale(k,n){
  var p=k.split('-'), d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1+n, 1);
  return clefMois(d);
}
function eur(n,dec){
  var v = Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:dec===0?0:2, maximumFractionDigits:dec===0?0:2});
  return (n<0?'−':'')+v+' €';
}
function signe(n,dec){
  var v = Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:dec===0?0:2, maximumFractionDigits:dec===0?0:2});
  return (n<0?'−':'+')+v+' €';
}

function charger(){
  var brut = null;
  try { brut = localStorage.getItem(CLE); } catch(e){}
  if(brut){
    try { S = JSON.parse(brut); } catch(e){ S = null; }
  }
  if(!S){
    S = { version:1, reglages:{ plafond:600, retraite:745, reportInitial:0, cats:CATS_DEF }, mois:{} };
  }
  if(!S.reglages.cats || S.reglages.cats.length !== CATS_DEF.length){ S.reglages.cats = CATS_DEF; }
}
function sauver(){
  try { localStorage.setItem(CLE, JSON.stringify(S)); }
  catch(e){ alert("Les données n'ont pas pu être enregistrées."); }
}
function cat(id){
  for(var i=0;i<S.reglages.cats.length;i++){ if(S.reglages.cats[i].id===id) return S.reglages.cats[i]; }
  return S.reglages.cats[S.reglages.cats.length-1];
}

function moisExistants(){
  var k = Object.keys(S.mois); k.sort(); return k;
}
function assurerMois(k){
  if(S.mois[k]) return S.mois[k];
  var liste = moisExistants(), source = null;
  for(var i=liste.length-1;i>=0;i--){ if(liste[i] < k){ source = S.mois[liste[i]]; break; } }
  if(!source){ for(var j=0;j<liste.length;j++){ if(liste[j] > k){ source = S.mois[liste[j]]; break; } } }
  var passifs = [];
  var modele = source ? source.passifs : PASSIFS_DEF;
  for(var p=0;p<modele.length;p++){
    passifs.push({ id:uid(), nom:modele[p].nom, montant:modele[p].montant, passe:false });
  }
  S.mois[k] = {
    retraite: source ? source.retraite : S.reglages.retraite,
    passifs: passifs,
    lignes: []
  };
  sauver();
  return S.mois[k];
}
function totalPassifs(k){
  var m = S.mois[k], t = 0;
  if(!m) return 0;
  for(var i=0;i<m.passifs.length;i++){ t += Number(m.passifs[i].montant)||0; }
  return t;
}
function sommeLignes(k){
  var m = S.mois[k], t = 0;
  if(!m) return 0;
  for(var i=0;i<m.lignes.length;i++){ t += Number(m.lignes[i].montant)||0; }
  return t;
}
function report(k){
  var prec = moisDecale(k,-1);
  if(S.mois[prec]) return solde(prec);
  return Number(S.reglages.reportInitial)||0;
}
function soldeDepart(k){
  var m = S.mois[k];
  if(!m) return 0;
  return report(k) + (Number(m.retraite)||0) - totalPassifs(k);
}
function solde(k){
  return soldeDepart(k) + sommeLignes(k);
}

function rendreEntete(){
  document.getElementById('moistitre').textContent = libMois(moisCourant);
  var s = solde(moisCourant), plaf = Number(S.reglages.plafond)||600;
  document.getElementById('soldeval').textContent = eur(s, 0);
  var dette = s < 0 ? -s : 0;
  var pct = Math.min(100, Math.round(dette / plaf * 100));
  var bar = document.getElementById('jaugebar');
  bar.style.width = pct + '%';
  bar.style.background = pct >= 100 ? 'var(--alerte)' : (pct >= 75 ? 'var(--rouge)' : 'var(--or)');
  document.getElementById('jaugeg').textContent = 'découvert ' + eur(plaf,0);
  document.getElementById('jauged').textContent = dette >= plaf
    ? eur(dette - plaf,0) + ' au-delà'
    : eur(plaf - dette,0) + ' restants';
  document.getElementById('ravval').textContent = eur(soldeDepart(moisCourant), 0);
}

function rendreLignes(){
  var m = assurerMois(moisCourant), h = '';
  var l = m.lignes.slice().sort(function(a,b){
    if(a.date === b.date) return (b.ordre||0) - (a.ordre||0);
    return a.date < b.date ? 1 : -1;
  });
  if(!l.length){
    h = '<div class="vide">Rien pour ce mois.<br>Appuie sur Ajouter pour la première ligne.</div>';
  } else {
    for(var i=0;i<l.length;i++){
      var x = l[i], c = cat(x.cat), p = x.date.split('-');
      h += '<div class="ligne'+(x.valide?' valide':'')+'" data-id="'+x.id+'">'
         + '<button class="coche" data-coche="'+x.id+'" aria-label="Valider">'+svg(x.valide?'coche':'case',18)+'</button>'
         + '<span class="ico">'+svg(c.ico,19,c.couleur)+'</span>'
         + '<div class="corps" data-edit="'+x.id+'">'
         + '<div class="lib">'+echap(x.libelle)+'</div>'
         + '<div class="meta">'+p[2]+'.'+p[1]+' · '+c.nom.toLowerCase()+'</div></div>'
         + '<div class="mont num'+(x.montant>0?' plus':'')+'" data-edit="'+x.id+'">'+signeCourt(x.montant)+'</div>'
         + '</div>';
    }
  }
  document.getElementById('lignes').innerHTML = h;
}
function signeCourt(n){
  var v = Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'−':'+')+v;
}
function echap(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function totauxCats(k){
  var m = S.mois[k], out = {};
  for(var i=0;i<S.reglages.cats.length;i++){ out[S.reglages.cats[i].id] = {sortie:0, entree:0}; }
  if(!m) return out;
  for(var j=0;j<m.lignes.length;j++){
    var x = m.lignes[j];
    if(!out[x.cat]) out[x.cat] = {sortie:0, entree:0};
    if(x.montant < 0) out[x.cat].sortie += -x.montant; else out[x.cat].entree += x.montant;
  }
  return out;
}

function rendreBilan(){
  var k = moisCourant, m = assurerMois(k);
  var t = totauxCats(k), tp = totauxCats(moisDecale(k,-1));
  var prec = S.mois[moisDecale(k,-1)];
  var cats = S.reglages.cats;

  var courant = 0, maxC = 0, i, c;
  for(i=0;i<cats.length;i++){
    c = cats[i];
    if(c.groupe === 'courant'){ courant += t[c.id].sortie; if(t[c.id].sortie > maxC) maxC = t[c.id].sortie; }
  }
  var sortiesLignes = 0, entreesLignes = 0;
  for(i=0;i<cats.length;i++){ sortiesLignes += t[cats[i].id].sortie; entreesLignes += t[cats[i].id].entree; }
  var pas = totalPassifs(k);
  var rep = report(k), rembours = rep < 0 ? -rep : 0;
  var sorties = sortiesLignes + pas + rembours;
  var entrees = entreesLignes + (Number(m.retraite)||0);
  var ecart = entrees - sorties;

  var h = '';
  h += '<div class="duo">'
     + '<div class="bloc"><div class="l">sorties</div><div class="v">'+eur(sorties,0)+'</div></div>'
     + '<div class="bloc"><div class="l">entrées</div><div class="v">'+eur(entrees,0)+'</div></div>'
     + '</div>';

  var phrase = ecart > 60 ? 'le mois respire' : (ecart >= -60 ? 'le mois est au ras' : 'ça se tend');
  var coul = ecart >= 0 ? 'var(--vert)' : 'var(--rouge)';
  h += '<div class="carte2 ecart"><div><div class="v" style="color:'+coul+'">'+signe(ecart,0)+'</div>'
     + '<div class="p">'+phrase+'</div></div>'
     + '<span style="color:'+coul+';line-height:0">'+svg(ecart>=0?'hausse':'baisse',26)+'</span></div>';

  h += '<div class="sstitre">le courant · '+eur(courant,0)+'</div><div class="carte pad">';
  for(i=0;i<cats.length;i++){
    c = cats[i];
    if(c.groupe !== 'courant') continue;
    var v = t[c.id].sortie, larg = maxC > 0 ? Math.round(v/maxC*100) : 0;
    var fl = '';
    if(prec){
      var av = tp[c.id] ? tp[c.id].sortie : 0;
      if(v > av * 1.1 && v - av > 15) fl = '<span style="color:var(--rouge);line-height:0">'+svg('fleched',13)+'</span>';
      else if(v < av * 0.9 && av - v > 15) fl = '<span style="color:var(--vert);line-height:0">'+svg('flecheb',13)+'</span>';
    }
    h += '<div class="barre"><div class="t"><span>'+svg(c.ico,16,c.couleur)+c.nom+'</span>'
       + '<b>'+eur(v,0)+fl+'</b></div>'
       + '<div class="piste"><i style="width:'+larg+'%;background:'+c.barre+'"></i></div></div>';
  }
  h += '</div>';

  h += '<div class="sstitre">le reste</div><div class="carte">';
  for(i=0;i<cats.length;i++){
    c = cats[i];
    if(c.groupe !== 'autre') continue;
    var s2 = t[c.id].sortie, e2 = t[c.id].entree;
    var val = '−'+Math.round(s2)+' <span style="color:var(--brun)">/</span> <span style="color:var(--vert)">+'+Math.round(e2)+'</span>';
    h += '<div class="rang"><span>'+svg(c.ico,16,c.couleur)+c.nom+'</span><b>'+val+'</b></div>';
  }
  h += '</div>';

  h += '<div class="sstitre" style="margin-top:18px">les fixes</div><div class="carte">'
     + '<div class="rang"><span>Passifs du mois</span><b>'+eur(pas,0)+'</b></div>'
     + '<div class="rang"><span>Découvert reporté</span><b>'+eur(rembours,0)+'</b></div>'
     + '<div class="rang"><span>Retraite</span><b style="color:var(--vert)">'+eur(Number(m.retraite)||0,0)+'</b></div>'
     + '</div>';

  h += '<div class="pied"><span>'+libMois(k)+'</span><span>'+m.lignes.length+' lignes</span></div>';
  document.getElementById('s-bilan').innerHTML = h;
}

function rendrePassifs(){
  var m = assurerMois(moisCourant), h = '', i;
  var passes = 0, attente = 0, montantAttente = 0;
  for(i=0;i<m.passifs.length;i++){
    if(m.passifs[i].passe) passes++; else { attente++; montantAttente += Number(m.passifs[i].montant)||0; }
  }
  h += '<div class="grostotal"><div class="l">chaque mois, quoi qu\'il arrive</div>'
     + '<div class="v">'+eur(totalPassifs(moisCourant),0)+'</div>'
     + '<div class="s">'+passes+' passés · '+attente+' en attente ('+eur(montantAttente,0)+')</div></div>';
  h += '<div class="carte">';
  if(!m.passifs.length){
    h += '<div class="vide">Aucun passif.<br>Ajoute tes prélèvements récurrents.</div>';
  }
  for(i=0;i<m.passifs.length;i++){
    var p = m.passifs[i];
    h += '<div class="ligne'+(p.passe?' valide':'')+'">'
       + '<button class="coche" data-passif="'+p.id+'" aria-label="Marquer passé">'+svg(p.passe?'coche':'case',18)+'</button>'
       + '<div class="corps" data-passifedit="'+p.id+'"><div class="lib">'+echap(p.nom)+'</div></div>'
       + '<div class="mont num" data-passifedit="'+p.id+'">'+eur(Number(p.montant)||0,0)+'</div>'
       + '</div>';
  }
  h += '</div><button class="bouton" id="addpassif">+ Ajouter un passif</button>';
  document.getElementById('s-passifs').innerHTML = h;
  var b = document.getElementById('addpassif');
  if(b) b.addEventListener('click', function(){ ouvrirPassif(null); });
}

function rendre(){
  rendreEntete();
  if(onglet === 'mois') rendreLignes();
  if(onglet === 'bilan') rendreBilan();
  if(onglet === 'passifs') rendrePassifs();
}

function allerOnglet(nom, sansHisto){
  if(nom === 'reglages'){ ouvrirReglages(); return; }
  onglet = nom;
  var ids = ['mois','bilan','passifs'];
  for(var i=0;i<ids.length;i++){
    var sec = document.getElementById('s-'+ids[i]);
    var bt = document.getElementById('t-'+ids[i]);
    if(ids[i] === nom){ sec.classList.add('on'); bt.classList.add('on'); }
    else { sec.classList.remove('on'); bt.classList.remove('on'); }
  }
  document.getElementById('t-reglages').classList.remove('on');
  document.getElementById('main').scrollTop = 0;
  document.getElementById('entlab').textContent = 'solde';
  rendre();
  if(!sansHisto && nom !== 'mois') empiler();
}

function empiler(){ try { history.pushState({app:1}, ''); } catch(e){} }

function ouvrirTiroir(html){
  document.getElementById('tiroir').innerHTML = html;
  document.getElementById('tiroir').classList.add('on');
  document.getElementById('voile').classList.add('on');
  tiroirOuvert = true;
  empiler();
}
function fermerTiroir(){
  document.getElementById('tiroir').classList.remove('on');
  document.getElementById('voile').classList.remove('on');
  tiroirOuvert = false;
  edition = null;
}

function ouvrirLigne(id){
  var m = assurerMois(moisCourant), x = null, i;
  for(i=0;i<m.lignes.length;i++){ if(m.lignes[i].id === id) x = m.lignes[i]; }
  edition = x ? x.id : null;
  var auj = new Date(), dft = clefMois(auj)+'-'+String(auj.getDate()).padStart(2,'0');
  var d = x ? x.date : dft;
  var sortie = x ? (x.montant < 0) : true;
  var montant = x ? Math.abs(x.montant).toFixed(2).replace('.',',') : '';
  var catId = x ? x.cat : 'courses';

  var libs = {}, propositions = '';
  for(i=0;i<m.lignes.length;i++){ libs[m.lignes[i].libelle] = 1; }
  var prec = S.mois[moisDecale(moisCourant,-1)];
  if(prec){ for(i=0;i<prec.lignes.length;i++){ libs[prec.lignes[i].libelle] = 1; } }
  for(var nom in libs){ if(nom) propositions += '<option value="'+echap(nom)+'">'; }

  var h = '<h2>'+(x?'Modifier la ligne':'Nouvelle ligne')+'</h2><div class="filet"></div>';
  h += '<div class="champ"><label>Montant</label><input type="text" inputmode="decimal" id="f-montant" value="'+montant+'" placeholder="0,00"></div>';
  h += '<div class="champ"><label>Sens</label><div class="sens">'
     + '<button data-sens="sortie" class="'+(sortie?'on':'')+'">Sortie</button>'
     + '<button data-sens="entree" class="'+(sortie?'':'on')+'">Entrée</button></div></div>';
  h += '<div class="champ"><label>Libellé</label><input type="text" id="f-lib" list="libs" value="'+(x?echap(x.libelle):'')+'" placeholder="Super U, diesel…"><datalist id="libs">'+propositions+'</datalist></div>';
  h += '<div class="champ"><label>Catégorie</label><div class="cats">';
  for(i=0;i<S.reglages.cats.length;i++){
    var c = S.reglages.cats[i];
    h += '<button data-cat="'+c.id+'" class="'+(c.id===catId?'on':'')+'"><span>'+svg(c.ico,18,c.couleur)+'</span>'+c.nom+'</button>';
  }
  h += '</div></div>';
  h += '<div class="champ"><label>Date</label><input type="date" id="f-date" value="'+d+'"></div>';
  h += '<div class="actions">'
     + (x?'<button class="danger" id="f-suppr" aria-label="Supprimer">×</button>':'')
     + '<button class="plein" id="f-ok">Enregistrer</button></div>';
  ouvrirTiroir(h);

  var t = document.getElementById('tiroir');
  t.dataset.sens = sortie ? 'sortie' : 'entree';
  t.dataset.cat = catId;
  var sensBtns = t.querySelectorAll('[data-sens]');
  for(i=0;i<sensBtns.length;i++){
    sensBtns[i].addEventListener('click', function(){
      var b = t.querySelectorAll('[data-sens]');
      for(var j=0;j<b.length;j++) b[j].classList.remove('on');
      this.classList.add('on');
      t.dataset.sens = this.getAttribute('data-sens');
    });
  }
  var catBtns = t.querySelectorAll('[data-cat]');
  for(i=0;i<catBtns.length;i++){
    catBtns[i].addEventListener('click', function(){
      var b = t.querySelectorAll('[data-cat]');
      for(var j=0;j<b.length;j++) b[j].classList.remove('on');
      this.classList.add('on');
      t.dataset.cat = this.getAttribute('data-cat');
    });
  }
  document.getElementById('f-ok').addEventListener('click', enregistrerLigne);
  var sup = document.getElementById('f-suppr');
  if(sup) sup.addEventListener('click', supprimerLigne);
  setTimeout(function(){ var f = document.getElementById('f-montant'); if(f && !x) f.focus(); }, 250);
}

function enregistrerLigne(){
  var t = document.getElementById('tiroir');
  var brut = document.getElementById('f-montant').value.replace(/\s/g,'').replace(',','.');
  var v = parseFloat(brut);
  if(!brut || isNaN(v) || v <= 0){
    document.getElementById('f-montant').style.borderColor = 'var(--alerte)';
    return;
  }
  var m = assurerMois(moisCourant);
  var montant = t.dataset.sens === 'sortie' ? -Math.abs(v) : Math.abs(v);
  var lib = document.getElementById('f-lib').value.trim();
  var date = document.getElementById('f-date').value || (clefMois(new Date())+'-01');
  if(!lib) lib = cat(t.dataset.cat).nom;

  if(edition){
    for(var i=0;i<m.lignes.length;i++){
      if(m.lignes[i].id === edition){
        m.lignes[i].montant = montant;
        m.lignes[i].libelle = lib;
        m.lignes[i].cat = t.dataset.cat;
        m.lignes[i].date = date;
      }
    }
  } else {
    var kd = date.slice(0,7);
    var cible = kd === moisCourant ? m : assurerMois(kd);
    cible.lignes.push({ id:uid(), date:date, libelle:lib, montant:montant, cat:t.dataset.cat, valide:false, ordre:Date.now() });
  }
  sauver();
  fermerTiroir();
  try { history.back(); } catch(e){}
  rendre();
}

function supprimerLigne(){
  var m = assurerMois(moisCourant), garde = [];
  for(var i=0;i<m.lignes.length;i++){ if(m.lignes[i].id !== edition) garde.push(m.lignes[i]); }
  m.lignes = garde;
  sauver();
  fermerTiroir();
  try { history.back(); } catch(e){}
  rendre();
}

function ouvrirPassif(id){
  var m = assurerMois(moisCourant), p = null, i;
  for(i=0;i<m.passifs.length;i++){ if(m.passifs[i].id === id) p = m.passifs[i]; }
  edition = p ? p.id : null;
  var h = '<h2>'+(p?'Modifier le passif':'Nouveau passif')+'</h2><div class="filet"></div>';
  h += '<div class="champ"><label>Nom</label><input type="text" id="p-nom" value="'+(p?echap(p.nom):'')+'" placeholder="Netflix"></div>';
  h += '<div class="champ"><label>Montant mensuel</label><input type="text" inputmode="decimal" id="p-montant" value="'+(p?String(p.montant).replace('.',','):'')+'" placeholder="15"></div>';
  h += '<div class="actions">'
     + (p?'<button class="danger" id="p-suppr" aria-label="Supprimer">×</button>':'')
     + '<button class="plein" id="p-ok">Enregistrer</button></div>';
  h += '<div class="note">Le passif se reporte sur les mois suivants avec son montant. Modifier ici ne touche pas les mois déjà passés.</div>';
  ouvrirTiroir(h);
  document.getElementById('p-ok').addEventListener('click', function(){
    var nom = document.getElementById('p-nom').value.trim();
    var v = parseFloat(document.getElementById('p-montant').value.replace(',','.'));
    if(!nom || isNaN(v)){ document.getElementById('p-nom').style.borderColor = 'var(--alerte)'; return; }
    var mm = assurerMois(moisCourant);
    if(edition){
      for(var j=0;j<mm.passifs.length;j++){
        if(mm.passifs[j].id === edition){ mm.passifs[j].nom = nom; mm.passifs[j].montant = v; }
      }
    } else {
      mm.passifs.push({ id:uid(), nom:nom, montant:v, passe:false });
    }
    sauver(); fermerTiroir(); try{history.back();}catch(e){} rendre();
  });
  var sp = document.getElementById('p-suppr');
  if(sp) sp.addEventListener('click', function(){
    var mm = assurerMois(moisCourant), garde = [];
    for(var j=0;j<mm.passifs.length;j++){ if(mm.passifs[j].id !== edition) garde.push(mm.passifs[j]); }
    mm.passifs = garde;
    sauver(); fermerTiroir(); try{history.back();}catch(e){} rendre();
  });
}

function ouvrirReglages(){
  var m = assurerMois(moisCourant), i;
  var h = '<h2>Réglages</h2><div class="filet"></div>';
  h += '<div class="sstitre">le mois de '+libMois(moisCourant)+'</div>';
  h += '<div class="reg"><span>Retraite</span><input type="text" inputmode="decimal" id="r-retraite" value="'+(m.retraite)+'"></div>';
  var liste = moisExistants();
  if(!S.mois[moisDecale(moisCourant,-1)]){
    h += '<div class="reg"><span>Solde de départ</span><input type="text" inputmode="decimal" id="r-report" value="'+(S.reglages.reportInitial)+'"></div>';
  } else {
    h += '<div class="reg"><span>Reporté du mois passé</span><b class="num">'+eur(report(moisCourant),0)+'</b></div>';
  }
  h += '<div class="reg"><span>Découvert autorisé</span><input type="text" inputmode="decimal" id="r-plafond" value="'+(S.reglages.plafond)+'"></div>';
  h += '<div class="sstitre" style="margin-top:20px">les catégories</div>';
  for(i=0;i<S.reglages.cats.length;i++){
    var c = S.reglages.cats[i];
    h += '<div class="reg"><span style="display:flex;align-items:center;gap:9px">'+svg(c.ico,18,c.couleur)+'</span>'
       + '<input class="nom" type="text" data-catnom="'+c.id+'" value="'+echap(c.nom)+'"></div>';
  }
  h += '<div class="actions"><button id="r-export">Exporter</button><button id="r-import">Importer</button></div>';
  h += '<div class="actions"><button class="plein" id="r-ok">Enregistrer</button></div>';
  h += '<div class="note">L\'export enregistre un fichier de sauvegarde de tous tes mois. Garde-le quelque part : les données ne vivent que dans ce téléphone.</div>';
  ouvrirTiroir(h);

  document.getElementById('r-ok').addEventListener('click', function(){
    var mm = assurerMois(moisCourant);
    var rr = parseFloat(document.getElementById('r-retraite').value.replace(',','.'));
    if(!isNaN(rr)) mm.retraite = rr;
    var pl = parseFloat(document.getElementById('r-plafond').value.replace(',','.'));
    if(!isNaN(pl)) S.reglages.plafond = pl;
    var rp = document.getElementById('r-report');
    if(rp){ var v = parseFloat(rp.value.replace(',','.')); if(!isNaN(v)) S.reglages.reportInitial = v; }
    var noms = document.querySelectorAll('[data-catnom]');
    for(var j=0;j<noms.length;j++){
      var id = noms[j].getAttribute('data-catnom'), val = noms[j].value.trim();
      if(val){ for(var q=0;q<S.reglages.cats.length;q++){ if(S.reglages.cats[q].id === id) S.reglages.cats[q].nom = val; } }
    }
    sauver(); fermerTiroir(); try{history.back();}catch(e){} rendre();
  });
  document.getElementById('r-export').addEventListener('click', exporter);
  document.getElementById('r-import').addEventListener('click', importer);
}

function exporter(){
  var blob = new Blob([JSON.stringify(S)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'comptes-' + clefMois(new Date()) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function importer(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.addEventListener('change', function(){
    var f = inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var d = JSON.parse(r.result);
        if(!d.mois) throw new Error('format');
        S = d; sauver(); fermerTiroir(); try{history.back();}catch(e){}
        moisCourant = clefMois(new Date()); assurerMois(moisCourant); rendre();
      } catch(e){ alert("Ce fichier n'est pas une sauvegarde de l'application."); }
    };
    r.readAsText(f);
  });
  inp.click();
}

function init(){
  charger();
  moisCourant = clefMois(new Date());
  assurerMois(moisCourant);
  document.getElementById('i-mois').innerHTML = svg('liste',20);
  document.getElementById('i-bilan').innerHTML = svg('barres',20);
  document.getElementById('i-passifs').innerHTML = svg('boucle',20);
  document.getElementById('i-reglages').innerHTML = svg('roue',20);
  document.getElementById('prevm').innerHTML = svg('gauche',18);
  document.getElementById('nextm').innerHTML = svg('droite',18);
  rendre();

  document.getElementById('prevm').addEventListener('click', function(){
    moisCourant = moisDecale(moisCourant,-1); assurerMois(moisCourant); rendre();
  });
  document.getElementById('nextm').addEventListener('click', function(){
    moisCourant = moisDecale(moisCourant,1); assurerMois(moisCourant); rendre();
  });
  document.getElementById('ajouter').addEventListener('click', function(){ ouvrirLigne(null); });
  document.getElementById('t-mois').addEventListener('click', function(){ allerOnglet('mois'); });
  document.getElementById('t-bilan').addEventListener('click', function(){ allerOnglet('bilan'); });
  document.getElementById('t-passifs').addEventListener('click', function(){ allerOnglet('passifs'); });
  document.getElementById('t-reglages').addEventListener('click', function(){ ouvrirReglages(); });
  document.getElementById('voile').addEventListener('click', function(){
    fermerTiroir(); try{history.back();}catch(e){}
  });

  document.getElementById('main').addEventListener('click', function(e){
    var c = e.target.closest ? e.target.closest('[data-coche]') : null;
    if(c){ basculerLigne(c.getAttribute('data-coche')); return; }
    var p = e.target.closest ? e.target.closest('[data-passif]') : null;
    if(p){ basculerPassif(p.getAttribute('data-passif')); return; }
    var pe = e.target.closest ? e.target.closest('[data-passifedit]') : null;
    if(pe){ ouvrirPassif(pe.getAttribute('data-passifedit')); return; }
    var ed = e.target.closest ? e.target.closest('[data-edit]') : null;
    if(ed){ ouvrirLigne(ed.getAttribute('data-edit')); return; }
  });

  var x0 = 0, y0 = 0, suivi = false;
  var zone = document.getElementById('main');
  zone.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1){ suivi = false; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; suivi = true;
  }, {passive:true});
  zone.addEventListener('touchend', function(e){
    if(!suivi || tiroirOuvert) return;
    suivi = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    if(Math.abs(dx) < 70 || Math.abs(dy) > 45) return;
    var ordre = ['mois','bilan','passifs'];
    var i = ordre.indexOf(onglet);
    if(dx < 0 && i < ordre.length-1) allerOnglet(ordre[i+1]);
    if(dx > 0 && i > 0) allerOnglet(ordre[i-1]);
  }, {passive:true});

  try { history.replaceState({app:0}, ''); } catch(e){}
  window.addEventListener('popstate', function(){
    if(tiroirOuvert){ fermerTiroir(); return; }
    if(onglet !== 'mois'){ allerOnglet('mois', true); empiler(); return; }
  });
}

function basculerLigne(id){
  var m = assurerMois(moisCourant);
  for(var i=0;i<m.lignes.length;i++){
    if(m.lignes[i].id === id) m.lignes[i].valide = !m.lignes[i].valide;
  }
  sauver(); rendreLignes();
}
function basculerPassif(id){
  var m = assurerMois(moisCourant);
  for(var i=0;i<m.passifs.length;i++){
    if(m.passifs[i].id === id) m.passifs[i].passe = !m.passifs[i].passe;
  }
  sauver(); rendrePassifs();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

init();
</script>
</body>
</html>
